<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MSME Financial Health Card — IDBI Innovate 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1424;
  --panel:#161D33;
  --panel-alt:#1B2340;
  --panel-line:#2A3355;
  --text-pri:#EEF1F6;
  --text-mut:#8B93A7;
  --text-faint:#5C6280;
  --brass:#C9A15E;
  --brass-dim:#8C744A;
  --green:#4FAE7C;
  --green-bg:#16261F;
  --amber:#E0A63C;
  --amber-bg:#2A2216;
  --rose:#D9645A;
  --rose-bg:#2A1918;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--ink);
  color:var(--text-pri);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding:28px;
}
.wrap{max-width:1200px; margin:0 auto;}

/* Top bar */
.topbar{
  display:flex; justify-content:space-between; align-items:flex-end;
  padding-bottom:20px; margin-bottom:24px;
  border-bottom:1px solid var(--panel-line);
}
.brand-eyebrow{
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em;
  color:var(--brass); text-transform:uppercase; margin-bottom:6px;
}
.brand-title{
  font-family:'Fraunces',serif; font-weight:500; font-size:26px; color:var(--text-pri);
}
.brand-sub{ font-size:13px; color:var(--text-mut); margin-top:4px; }
.topbar-right{ text-align:right; font-size:12px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; }

/* Layout */
.layout{ display:grid; grid-template-columns:270px 1fr; gap:24px; }
@media (max-width:880px){ .layout{ grid-template-columns:1fr; } }

/* Sidebar */
.sidebar{
  background:var(--panel);
  border:1px solid var(--panel-line);
  border-radius:12px;
  padding:14px;
  height:fit-content;
}
.sidebar-label{
  font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em;
  color:var(--text-faint); text-transform:uppercase; padding:6px 8px 10px;
}
.msme-item{
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 10px; border-radius:8px; cursor:pointer; margin-bottom:2px;
  border:1px solid transparent;
}
.msme-item:hover{ background:var(--panel-alt); }
.msme-item.active{ background:var(--panel-alt); border-color:var(--brass-dim); }
.msme-name{ font-size:13px; font-weight:500; color:var(--text-pri); }
.msme-sector{ font-size:11px; color:var(--text-faint); margin-top:1px; }
.dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot-green{ background:var(--green); }
.dot-amber{ background:var(--amber); }
.dot-rose{ background:var(--rose); }

/* Main card */
.card{
  background:var(--panel);
  border:1px solid var(--panel-line);
  border-radius:16px;
  padding:32px;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg, var(--brass-dim), var(--brass), var(--brass-dim));
}
.card-header{
  display:flex; justify-content:space-between; align-items:flex-start;
  margin-bottom:28px; flex-wrap:wrap; gap:16px;
}
.biz-name{ font-family:'Fraunces',serif; font-weight:500; font-size:24px; }
.biz-meta{ font-size:13px; color:var(--text-mut); margin-top:6px; }
.biz-id{
  font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--brass);
  letter-spacing:.06em; margin-top:10px;
}
.band-pill{
  font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:500;
  padding:6px 14px; border-radius:20px; letter-spacing:.04em; height:fit-content;
}
.band-Green{ background:var(--green-bg); color:var(--green); border:1px solid var(--green); }
.band-Amber{ background:var(--amber-bg); color:var(--amber); border:1px solid var(--amber); }
.band-Red{ background:var(--rose-bg); color:var(--rose); border:1px solid var(--rose); }

/* Score + trajectory row */
.score-row{
  display:grid; grid-template-columns:200px 1fr; gap:32px;
  padding:24px 0; border-top:1px solid var(--panel-line); border-bottom:1px solid var(--panel-line);
  margin-bottom:28px; align-items:center;
}
@media (max-width:640px){ .score-row{ grid-template-columns:1fr; } }
.dial-wrap{ display:flex; flex-direction:column; align-items:center; }
.dial-score{
  font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--text-faint);
  text-align:center; margin-top:8px; letter-spacing:.05em;
}
.traj-block{ display:flex; flex-direction:column; gap:14px; }
.traj-row{ display:flex; align-items:center; gap:14px; }
.traj-arrow{
  width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:16px; flex-shrink:0;
}
.traj-up{ background:var(--green-bg); color:var(--green); }
.traj-flat{ background:var(--amber-bg); color:var(--amber); }
.traj-down{ background:var(--rose-bg); color:var(--rose); }
.traj-text-main{ font-size:14px; font-weight:500; }
.traj-text-sub{ font-size:12px; color:var(--text-mut); margin-top:2px; }
.traj-numbers{
  font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-mut);
  display:flex; gap:20px; padding-left:50px;
}
.traj-numbers b{ color:var(--text-pri); font-weight:500; }

/* Pillars */
.section-label{
  font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em;
  color:var(--text-faint); text-transform:uppercase; margin-bottom:14px;
}
.pillars{ margin-bottom:28px; }
.pillar-row{ margin-bottom:14px; }
.pillar-top{ display:flex; justify-content:space-between; margin-bottom:6px; }
.pillar-name{ font-size:13px; color:var(--text-pri); }
.pillar-weight{ font-size:11px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; }
.pillar-score{ font-size:13px; font-family:'IBM Plex Mono',monospace; color:var(--text-mut); }
.pillar-track{ height:6px; background:var(--panel-alt); border-radius:3px; overflow:hidden; }
.pillar-fill{ height:100%; border-radius:3px; background:var(--brass); }

/* Flags + lending */
.bottom-grid{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
@media (max-width:720px){ .bottom-grid{ grid-template-columns:1fr; } }
.flag-chip{
  display:inline-block; font-size:12px; padding:6px 12px; border-radius:16px;
  margin:0 6px 8px 0; border:1px solid var(--panel-line);
}
.flag-pos{ color:var(--green); border-color:var(--green); background:var(--green-bg); }
.flag-neg{ color:var(--rose); border-color:var(--rose); background:var(--rose-bg); }
.lend-box{
  background:var(--panel-alt); border:1px solid var(--panel-line); border-radius:10px; padding:18px;
}
.lend-row{ display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px solid var(--panel-line); }
.lend-row:last-child{ border-bottom:none; }
.lend-label{ color:var(--text-mut); }
.lend-val{ font-family:'IBM Plex Mono',monospace; color:var(--text-pri); }

/* Data sources footer */
.sources{
  display:flex; gap:12px; flex-wrap:wrap; margin-top:28px; padding-top:20px; border-top:1px solid var(--panel-line);
}
.source-chip{
  display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-mut);
  background:var(--panel-alt); border:1px solid var(--panel-line); padding:7px 12px; border-radius:8px;
  font-family:'IBM Plex Mono',monospace;
}
.source-chip .live-dot{ width:6px; height:6px; border-radius:50%; background:var(--green); }
.roadmap-note{ font-size:11px; color:var(--text-faint); margin-top:12px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <div class="brand-eyebrow">IDBI Innovate 2026 · Track 03</div>
      <div class="brand-title">MSME Financial Health Card</div>
      <div class="brand-sub">Alternate-data credit scoring with forward-looking trajectory, for New-to-Credit &amp; New-to-Bank enterprises</div>
    </div>
    <div class="topbar-right">Team Pulse Capital Labs<br>Sandbox mode · Synthetic dataset · 14 profiles</div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-label">MSME portfolio</div>
      <div id="msme-list"></div>
    </div>

    <div class="card" id="card"></div>
  </div>
</div>

<script>
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

function genSeries(seed, start, drift, vol, n){
  const rnd = mulberry32(seed);
  let v = start; const out = [];
  for(let i=0;i<n;i++){
    v = v + drift + (rnd()-0.5)*vol;
    out.push(Math.max(0, v));
  }
  return out;
}

function slope(arr){
  const n = arr.length;
  const xMean = (n-1)/2;
  const yMean = arr.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  for(let i=0;i<n;i++){ num += (i-xMean)*(arr[i]-yMean); den += (i-xMean)**2; }
  return den===0 ? 0 : num/den;
}
function mean(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }
function std(arr){ const m=mean(arr); return Math.sqrt(mean(arr.map(x=>(x-m)**2))); }

const profiles = [
  {id:"MSME-2201", name:"Anand Kirana Store", sector:"Retail · Grocery", seed:11, rev:[62,3.5,10], cf:[1.05,0.02,0.12], gst:88, epfo:70, digi:60, debt:35},
  {id:"MSME-2202", name:"Sundari Textile Weaves", sector:"Manufacturing · Textile", seed:22, rev:[70,4.0,9], cf:[1.15,0.03,0.10], gst:92, epfo:85, digi:55, debt:28},
  {id:"MSME-2203", name:"Falcon Auto Components", sector:"Manufacturing · Auto Parts", seed:33, rev:[58,-2.5,12], cf:[0.92,-0.02,0.14], gst:65, epfo:60, digi:50, debt:58},
  {id:"MSME-2204", name:"GreenLeaf Dairy Co-op", sector:"Agri · Dairy", seed:44, rev:[50,1.0,8], cf:[1.02,0.01,0.09], gst:70, epfo:55, digi:40, debt:42},
  {id:"MSME-2205", name:"UrbanBite Cloud Kitchen", sector:"Food Services", seed:55, rev:[45,5.5,14], cf:[0.98,0.04,0.18], gst:60, epfo:35, digi:82, debt:38},
  {id:"MSME-2206", name:"Nexbyte IT Studio", sector:"IT Services · Freelance", seed:66, rev:[68,2.0,7], cf:[1.20,0.01,0.08], gst:95, epfo:75, digi:90, debt:20},
  {id:"MSME-2207", name:"Bhaskar Construction Co.", sector:"Construction", seed:77, rev:[52,-3.5,16], cf:[0.85,-0.03,0.16], gst:48, epfo:40, digi:30, debt:66},
  {id:"MSME-2208", name:"Meridian E-Sellers", sector:"E-commerce · Apparel", seed:88, rev:[55,3.0,11], cf:[1.08,0.02,0.13], gst:78, epfo:50, digi:88, debt:33},
  {id:"MSME-2209", name:"Radiance Salon & Wellness", sector:"Personal Care Services", seed:99, rev:[40,1.5,10], cf:[0.95,0.01,0.11], gst:55, epfo:30, digi:65, debt:45},
  {id:"MSME-2210", name:"Om Sai Printing Press", sector:"Printing & Packaging", seed:110, rev:[47,-4.0,9], cf:[0.80,-0.04,0.12], gst:52, epfo:45, digi:25, debt:60},
  {id:"MSME-2211", name:"Krishi Agri Input Dealers", sector:"Agri · Trading", seed:121, rev:[60,2.5,9], cf:[1.10,0.02,0.10], gst:75, epfo:58, digi:48, debt:36},
  {id:"MSME-2212", name:"Vega Logistics & Fleet", sector:"Logistics & Transport", seed:132, rev:[65,-1.0,13], cf:[0.96,-0.01,0.15], gst:68, epfo:62, digi:42, debt:52},
  {id:"MSME-2213", name:"CarePlus Pharmacy Chain", sector:"Healthcare · Retail", seed:143, rev:[72,4.5,8], cf:[1.18,0.03,0.09], gst:90, epfo:72, digi:70, debt:24},
  {id:"MSME-2214", name:"Tarun Garment Exports", sector:"Manufacturing · Garment Exports", seed:154, rev:[38,-5.0,15], cf:[0.75,-0.05,0.17], gst:42, epfo:38, digi:35, debt:70},
];

function computeProfile(p){
  const revSeries = genSeries(p.seed, p.rev[0], p.rev[1], p.rev[2], 6);
  const cfSeries = genSeries(p.seed+1, p.cf[0], p.cf[1], p.cf[2], 6);

  const revMean = mean(revSeries);
  const revStd = std(revSeries);
  const revStability = Math.max(0, Math.min(100, revMean - revStd*1.2));

  const cfMean = mean(cfSeries);
  const cashFlowHealth = Math.max(0, Math.min(100, (cfMean-0.5)/1.3*100));

  const compliance = p.gst*0.6 + p.epfo*0.4;
  const digital = p.digi;
  const debtBehavior = 100 - p.debt;

  const overall = revStability*0.25 + cashFlowHealth*0.25 + compliance*0.20 + digital*0.15 + debtBehavior*0.15;

  const revSlope = slope(revSeries);
  const cfSlope = slope(cfSeries)*40;
  const compositeSlope = (revSlope*0.55 + cfSlope*0.45);
  const projectedDelta = compositeSlope*3;
  const projectedScore = Math.max(0, Math.min(100, overall + projectedDelta));

  let trajLabel, trajClass;
  if(compositeSlope > 0.8){ trajLabel="Improving"; trajClass="up"; }
  else if(compositeSlope < -0.8){ trajLabel="Declining"; trajClass="down"; }
  else { trajLabel="Stable"; trajClass="flat"; }

  let band;
  if(overall >= 70) band="Green";
  else if(overall >= 40) band="Amber";
  else band="Red";

  const flags = [];
  if(revStability >= 65) flags.push({t:"Consistent turnover growth", pos:true});
  if(revStability < 45) flags.push({t:"Revenue volatility detected", pos:false});
  if(cashFlowHealth >= 65) flags.push({t:"Healthy cash flow buffer", pos:true});
  if(cashFlowHealth < 40) flags.push({t:"Cash flow strain", pos:false});
  if(p.gst >= 80) flags.push({t:"Strong GST filing discipline", pos:true});
  if(p.gst < 55) flags.push({t:"Irregular GST filings", pos:false});
  if(p.debt >= 55) flags.push({t:"High debt utilization", pos:false});
  if(p.digi >= 75) flags.push({t:"Strong digital footprint", pos:true});

  let loanEligible, amountRange, rateBand;
  if(band==="Green"){ loanEligible="Eligible — fast-track"; amountRange="₹8L – ₹35L"; rateBand="10.5% – 12.5%"; }
  else if(band==="Amber"){ loanEligible="Eligible — standard review"; amountRange="₹3L – ₹12L"; rateBand="13% – 16%"; }
  else { loanEligible="Refer — secured / co-lending only"; amountRange="₹1L – ₹4L"; rateBand="17% – 20%"; }

  return {
    ...p, revSeries, cfSeries, revStability, cashFlowHealth, compliance, digital, debtBehavior,
    overall, projectedScore, projectedDelta, trajLabel, trajClass, band, flags,
    loanEligible, amountRange, rateBand
  };
}

const computed = profiles.map(computeProfile);
let activeId = computed[0].id;

function dotClass(band){ return band==="Green" ? "dot-green" : band==="Amber" ? "dot-amber" : "dot-rose"; }

function renderList(){
  const el = document.getElementById('msme-list');
  el.innerHTML = computed.map(p => `
    <div class="msme-item ${p.id===activeId?'active':''}" onclick="selectProfile('${p.id}')">
      <div>
        <div class="msme-name">${p.name}</div>
        <div class="msme-sector">${p.sector}</div>
      </div>
      <div class="dot ${dotClass(p.band)}"></div>
    </div>
  `).join('');
}

function dialSVG(score, band){
  const color = band==="Green" ? "var(--green)" : band==="Amber" ? "var(--amber)" : "var(--rose)";
  const r = 80, c = 2*Math.PI*r;
  const offset = c - (score/100)*c;
  return `
  <svg width="180" height="180" viewBox="0 0 180 180">
    <circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--panel-alt)" stroke-width="12"/>
    <circle cx="90" cy="90" r="${r}" fill="none" stroke="${color}" stroke-width="12"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
      transform="rotate(-90 90 90)"/>
    <text x="90" y="84" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="34" font-weight="600" fill="var(--text-pri)">${Math.round(score)}</text>
    <text x="90" y="106" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="${color}">${band.toUpperCase()}</text>
  </svg>`;
}

function trajArrow(cls){
  if(cls==="up") return "&#8599;";
  if(cls==="down") return "&#8600;";
  return "&#8594;";
}

function renderCard(){
  const p = computed.find(x=>x.id===activeId);
  const el = document.getElementById('card');
  el.innerHTML = `
    <div class="card-header">
      <div>
        <div class="biz-name">${p.name}</div>
        <div class="biz-meta">${p.sector}</div>
        <div class="biz-id">${p.id} &nbsp;·&nbsp; Health Card issued via alternate-data engine</div>
      </div>
      <div class="band-pill band-${p.band}">${p.band === 'Green' ? 'Low Risk' : p.band === 'Amber' ? 'Moderate Risk' : 'High Risk'}</div>
    </div>

    <div class="score-row">
      <div class="dial-wrap">
        ${dialSVG(p.overall, p.band)}
        <div class="dial-score">Financial Health Score</div>
      </div>
      <div class="traj-block">
        <div class="traj-row">
          <div class="traj-arrow traj-${p.trajClass}">${trajArrow(p.trajClass)}</div>
          <div>
            <div class="traj-text-main">${p.trajLabel} trajectory</div>
            <div class="traj-text-sub">Projected over next 90 days based on GST momentum &amp; cash flow acceleration</div>
          </div>
        </div>
        <div class="traj-numbers">
          <span>Current: <b>${Math.round(p.overall)}</b></span>
          <span>Projected (90d): <b>${Math.round(p.projectedScore)}</b></span>
          <span>Δ: <b>${p.projectedDelta>=0?'+':''}${p.projectedDelta.toFixed(1)}</b></span>
        </div>
      </div>
    </div>

    <div class="pillars">
      <div class="section-label">Score composition — 5 pillar framework</div>
      ${renderPillar('Revenue stability', 25, p.revStability)}
      ${renderPillar('Cash flow health', 25, p.cashFlowHealth)}
      ${renderPillar('Compliance discipline', 20, p.compliance)}
      ${renderPillar('Digital footprint', 15, p.digital)}
      ${renderPillar('Debt behavior', 15, p.debtBehavior)}
    </div>

    <div class="bottom-grid">
      <div>
        <div class="section-label">Signals detected</div>
        ${p.flags.map(f => `<span class="flag-chip ${f.pos?'flag-pos':'flag-neg'}">${f.t}</span>`).join('')}
      </div>
      <div>
        <div class="section-label">Lending recommendation</div>
        <div class="lend-box">
          <div class="lend-row"><span class="lend-label">Status</span><span class="lend-val">${p.loanEligible}</span></div>
          <div class="lend-row"><span class="lend-label">Suggested amount</span><span class="lend-val">${p.amountRange}</span></div>
          <div class="lend-row"><span class="lend-label">Indicative rate band</span><span class="lend-val">${p.rateBand}</span></div>
        </div>
      </div>
    </div>

    <div class="sources">
      <div class="source-chip"><span class="live-dot"></span>GST · synced 4h ago</div>
      <div class="source-chip"><span class="live-dot"></span>UPI (AA) · synced 1h ago</div>
      <div class="source-chip"><span class="live-dot"></span>EPFO · synced 1d ago</div>
      <div class="source-chip"><span class="live-dot"></span>Account Aggregator · linked</div>
    </div>
    <div class="roadmap-note">Roadmap: live sandbox integration with ULI / OCEN / AA ecosystems for near real-time score refresh — see architecture appendix.</div>
  `;
}

function renderPillar(name, weight, score){
  return `
    <div class="pillar-row">
      <div class="pillar-top">
        <span class="pillar-name">${name} <span class="pillar-weight">(${weight}%)</span></span>
        <span class="pillar-score">${Math.round(score)}/100</span>
      </div>
      <div class="pillar-track"><div class="pillar-fill" style="width:${score}%"></div></div>
    </div>
  `;
}

function selectProfile(id){
  activeId = id;
  renderList();
  renderCard();
}

renderList();
renderCard();
</script>
</body>
</html>
